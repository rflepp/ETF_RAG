[project]
name = "etf-rag-pipeline"
version = "0.1.0"
description = "Builds the ETF document index (structured data + vector chunks) for the ETF advisor site"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pymupdf>=1.24",
    "pydantic>=2.7",
    "numpy>=1.26",
    "fastembed>=0.4",
]

[project.optional-dependencies]
agent = [
    "langgraph>=0.4",
    "langsmith>=0.3",
    "langchain-core>=0.3",
    "langchain-mistralai>=0.2",
    "langchain-google-genai>=2.0",
    "langchain-ollama>=0.3",
    "qdrant-client>=1.12",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline", "agent"]
