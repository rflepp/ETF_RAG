name: Deploy agent API (Cloud Run)

# One-time GCP setup: tools/gcp-setup.sh. It prints the repository variables to set here:
#   GCP_PROJECT_ID, GCP_REGION, GCP_WIF_PROVIDER, GCP_DEPLOY_SA, GCP_RUNTIME_SA, QDRANT_URL
# Secrets live in Secret Manager (not in GitHub); keyless auth through Workload Identity Federation.

on:
  push:
    branches: [main]
    paths: ["agent/**", "pipeline/**", "site/rules/**", "pyproject.toml", "uv.lock", "Dockerfile",
            ".github/workflows/deploy-agent.yml"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-agent
  cancel-in-progress: false

env:
  SERVICE: etf-agent
  REGION: ${{ vars.GCP_REGION || 'europe-west6' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --group dev --extra agent
      - run: uv run pytest -q

  deploy:
    needs: test
    if: vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push the image
        id: image
        run: |
          IMAGE="$REGION-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/etf-compass/$SERVICE:${GITHUB_SHA::12}"
          gcloud auth configure-docker "$REGION-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "ref=$IMAGE" >> "$GITHUB_OUTPUT"

      - id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ steps.image.outputs.ref }}
          # the API checks its own bearer tokens (AGENT_API_TOKENS), so Cloud Run IAM lets requests through
          flags: >-
            --service-account=${{ vars.GCP_RUNTIME_SA }}
            --allow-unauthenticated
            --cpu=1 --memory=2Gi --concurrency=4
            --min-instances=0 --max-instances=2
            --timeout=180
          env_vars: |
            LLM_CHAIN=mistral
            QDRANT_URL=${{ vars.QDRANT_URL }}
            LANGSMITH_TRACING=true
            LANGSMITH_PROJECT=ETF_RAG
            LANGSMITH_ENDPOINT=https://eu.api.smith.langchain.com
            ALLOWED_ORIGINS=${{ vars.ALLOWED_ORIGINS }}
          secrets: |
            MISTRAL_API_KEY=mistral-api-key:latest
            QDRANT_API_KEY=qdrant-api-key:latest
            LANGSMITH_API_KEY=langsmith-api-key:latest
            AGENT_API_TOKENS=agent-api-tokens:latest

      - name: Smoke test
        run: curl -fsS --retry 5 --retry-delay 10 --retry-all-errors "${{ steps.deploy.outputs.url }}/healthz"
