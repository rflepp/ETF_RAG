# Monthly update PRs, one grouped PR per ecosystem; security fixes arrive as soon as they are published.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: { interval: monthly }
    groups: { python: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /worker
    schedule: { interval: monthly }
    groups: { worker: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { actions: { patterns: ["*"] } }
